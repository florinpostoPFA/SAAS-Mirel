# Nginx: postosaas proxy + split logs (example)
#
# Copy fragments into your `server { ... }` for postosaas.com (paths are suggestions).
# Reload: `sudo nginx -t && sudo systemctl reload nginx`
#
# Tail split logs:
#   tail -f /var/log/nginx/postosaas.access.log
#   tail -f /var/log/nginx/postosaas.error.log

log_format postosaas_api '$remote_addr - $remote_user [$time_local] '
  '"$request" $status $body_bytes_sent '
  'rid=$request_id ref="$http_referer" '
  'ua="$http_user_agent"';

# Use inside server { } for the public site:
#
# access_log /var/log/nginx/postosaas.access.log postosaas_api;
# error_log  /var/log/nginx/postosaas.error.log warn;
